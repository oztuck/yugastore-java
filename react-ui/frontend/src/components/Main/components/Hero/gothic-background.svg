<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="537" viewBox="0 0 1440 537">
  <!-- Original hero background art for the "modern gothic" storefront redesign
       (specs/storefront-gothic-redesign): a full moon, gargoyle silhouette on a
       ledge, and distant bats. Hand-drawn shapes, no third-party artwork. -->
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#433646" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#433646" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05030A" />
      <stop offset="100%" stop-color="#0f0e12" />
    </linearGradient>
  </defs>

  <rect width="1440" height="537" fill="url(#skyFade)" />

  <!-- moon glow + disc -->
  <circle cx="1180" cy="140" r="220" fill="url(#moonGlow)" />
  <circle cx="1180" cy="140" r="70" fill="#f0ebf3" opacity="0.85" />

  <!-- distant bats -->
  <g fill="#1a1420" opacity="0.8">
    <path d="M180 90 q14 -16 28 0 q6 -8 12 0 q6 -8 12 0 q14 -16 28 0 q-20 6 -26 16 q-8 -6 -14 -2 q-6 -4 -14 2 q-6 -10 -26 -16 z" />
    <path d="M900 60 q10 -12 20 0 q4 -6 8 0 q4 -6 8 0 q10 -12 20 0 q-14 4 -18 12 q-6 -4 -10 -1 q-4 -3 -10 1 q-4 -8 -18 -12 z" />
    <path d="M420 200 q8 -10 16 0 q3 -5 6 0 q3 -5 6 0 q8 -10 16 0 q-11 3 -14 9 q-5 -3 -8 -1 q-3 -2 -8 1 q-3 -6 -14 -9 z" />
  </g>

  <!-- gargoyle silhouette perched on a ledge -->
  <g fill="#05030A">
    <rect x="0" y="470" width="1440" height="67" />
    <path d="M660 470
      c0 -18 6 -32 16 -42
      c4 -10 2 -22 -6 -28
      c10 -4 20 0 24 10
      c2 -14 12 -24 26 -24
      c14 0 24 10 26 24
      c4 -10 14 -14 24 -10
      c-8 6 -10 18 -6 28
      c10 10 16 24 16 42
      z" />
    <!-- folded wings -->
    <path d="M600 470 c10 -40 40 -60 60 -50 c-16 6 -30 24 -34 50 z" />
    <path d="M840 470 c-10 -40 -40 -60 -60 -50 c16 6 30 24 34 50 z" />
  </g>
  <g fill="#A10032" opacity="0.9">
    <circle cx="712" cy="416" r="3" />
    <circle cx="728" cy="416" r="3" />
  </g>
</svg>
